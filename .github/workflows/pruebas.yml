name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Linux pagina Word con LibreOffice y lee escaneos con Tesseract; macOS
      # lee escaneos con Vision. Ahí esas pruebas tienen que correr de verdad.
      - name: Motores de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-spa libreoffice-writer-nogui
          echo "DOCPACK_REQUIRE_OCR=1" >> "$GITHUB_ENV"
          echo "DOCPACK_REQUIRE_LAYOUT=1" >> "$GITHUB_ENV"
      - name: OCR obligatorio en macOS
        if: runner.os == 'macOS'
        run: echo "DOCPACK_REQUIRE_OCR=1" >> "$GITHUB_ENV"
      - name: Pruebas del motor
        run: cargo test --locked --manifest-path engine/Cargo.toml
      - name: Lanzador
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --release --locked --manifest-path engine/Cargo.toml
          os=$([ "$(uname -s)" = Darwin ] && echo macos || echo linux)
          if [ "$(uname -m)" = arm64 ] || [ "$(uname -m)" = aarch64 ]; then arch=arm64; else arch=x64; fi
          mkdir -p "plugins/claude-code/native/$os-$arch"
          cp engine/target/release/docpack "plugins/claude-code/native/$os-$arch/docpack"
          version=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' plugins/claude-code/.claude-plugin/plugin.json)
          test "$(plugins/claude-code/bin/docpack --version)" = "docpack $version"
