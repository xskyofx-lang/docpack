  <text x="28" y="62" font-size="13" fill="#5b6576">DocPack 0.3 (solo tablas con bordes) contra 0.4 (también sin bordes y unidas entre páginas)</text>

  <text x="28" y="104" font-size="14" fill="#1b2330">Guía de 2 409 páginas</text>
  <text x="28" y="121" font-size="12" fill="#7a8494">tablas sin bordes</text>
  <rect x="230" y="92" width="2" height="14" fill="#b8c1cf"/>
  <text x="240" y="104" font-size="12" fill="#5b6576">0.3 · 0</text>
  <rect x="230" y="110" width="440" height="16" rx="4" fill="#2f6fde"/>
  <text x="662" y="122" font-size="12" font-weight="600" fill="#ffffff" text-anchor="end">0.4 · 2 271</text>

  <text x="28" y="166" font-size="14" fill="#1b2330">Guía de 940 páginas</text>
  <text x="28" y="183" font-size="12" fill="#7a8494">157 tablas de 3+ páginas unidas</text>
