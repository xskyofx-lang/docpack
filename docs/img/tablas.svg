<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Tablas leídas en guías PDF reales</title>
  <desc id="d">Guía técnica de 2 409 páginas con tablas sin bordes: 0 tablas con la versión 0.3, 2 271 con la 0.4. Guía de formatos de 940 páginas: 383 tablas con la 0.3, 530 con la 0.4, 157 de ellas unidas a lo largo de 3 páginas o más. Tablas revisadas a mano: 5 de 5 iguales.</desc>
