  <text x="230" y="236" font-size="22" font-weight="700" fill="#1f8a4c">5 de 5</text>
  <text x="310" y="236" font-size="13" fill="#5b6576">filas, columnas, encabezado, título y páginas iguales</text>

  <text x="692" y="268" font-size="11" fill="#7a8494" text-anchor="end">Una página que parece tabla y no se pudo leer lleva su imagen: 11 de 2 409</text>
