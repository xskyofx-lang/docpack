  <text x="548" y="353" font-size="12" font-weight="600" fill="#1b2330">5.2 M (−32 %)</text>
  <text x="692" y="394" font-size="11" fill="#7a8494" text-anchor="end">Word y Excel salen idénticos · sin perder contenido (revisado palabra por palabra) · mismo tiempo de conversión</text>
