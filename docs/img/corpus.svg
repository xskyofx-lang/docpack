  <text x="330" y="185" font-size="12" font-weight="600" fill="#1b2330">2</text>
  <text x="28" y="224" font-size="14" fill="#1b2330">Palabras con letras desordenadas</text>
  <text x="28" y="241" font-size="12" fill="#7a8494">«sufb ield» por «subfield»</text>
