<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">DocPack 0.4.0 contra 0.4.1 en 44 documentos reales</title>
  <desc id="d">27 guías PDF, 7 diseños Word y 10 libros de Excel. Tablas numeradas con CSV propio: 88 % con 0.4.0, 97 % con 0.4.1. Tablas que se comían a la siguiente: 112 a 2. Palabras con letras desordenadas: 1 448 a 0. Caracteres de encabezados y pies repetidos: 1.72 millones a 0.08 millones. Tokens de texto: 7.7 millones a 5.2 millones, 32 % menos.</desc>
  <rect width="720" height="410" rx="14" fill="#ffffff" stroke="#d8dee8"/>
  <text x="28" y="40" font-size="19" font-weight="600" fill="#1b2330">0.4.0 contra 0.4.1 en 44 documentos reales</text>
  <text x="28" y="62" font-size="13" fill="#5b6576">27 guías PDF (hasta 3 220 páginas), 7 diseños Word y 10 libros de Excel</text>
