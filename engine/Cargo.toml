[package]
name = "docpack"
version = "0.2.0"
edition = "2021"
authors = ["Juan Antonio Sandoval Puente"]
homepage = "https://skyoflies.com"
description = "Turns PDF, DOCX, XLSX and PPTX documents into a structured pack (index, sections, tables, page images) that an AI reads by parts."
license = "MIT"
repository = "https://github.com/xskyofx-lang/docpack"
readme = "../README.md"

[lib]
name = "docpack"
path = "src/lib.rs"

[[bin]]
name = "docpack"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
calamine = "0.37.0"
pdf-extract = "0.12.1"
lopdf = "0.42"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Pdf", "Storage", "Storage_Streams", "Foundation"] }

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
strip = true
